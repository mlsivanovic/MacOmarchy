<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>MacOmarchy Settings</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --sidebar: #ececf0;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: #d8d8de;
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.12);
    --danger: #d70015;
    --danger-soft: rgba(215, 0, 21, 0.09);
    --field: #ffffff;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --panel: #232325;
      --sidebar: #18181a;
      --text: #f2f2f7;
      --muted: #98989f;
      --line: #38383c;
      --accent: #64a8ff;
      --accent-soft: rgba(100, 168, 255, 0.16);
      --danger: #ff6961;
      --danger-soft: rgba(255, 105, 97, 0.12);
      --field: #2c2c2f;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #app { display: flex; height: 100%; }
  aside {
    width: 208px;
    flex: 0 0 208px;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    padding: 18px 12px 12px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
    padding: 0 10px 14px;
  }
  nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .nav-item {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    text-align: left;
    padding: 7px 10px;
    border-radius: 7px;
    font: inherit;
    cursor: pointer;
  }
  .nav-item:hover { background: rgba(127, 127, 127, 0.12); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .side-foot {
    margin-top: auto;
    padding: 14px 10px 4px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .side-foot code { color: var(--muted); font-size: 10.5px; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 26px 16px;
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
  .title-line { display: flex; align-items: center; gap: 8px; }
  .actions { display: flex; gap: 8px; flex: 0 0 auto; padding-top: 4px; }
  button.action {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--field);
    color: var(--text);
    border-radius: 7px;
    padding: 5px 11px;
    font: inherit;
    cursor: pointer;
  }
  button.action:hover { border-color: var(--muted); }
  .banner {
    margin: 14px 26px 0;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 12px;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .hidden { display: none; }
  #content { overflow-y: auto; padding: 4px 26px 60px; }
  .field { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  .field-head { display: flex; align-items: center; gap: 8px; }
  .field-title { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .field-name { font-weight: 600; }
  .info-button {
    appearance: none;
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    padding: 0;
    border: 0;
    background: transparent;
    font: 15px/1 "Apple Color Emoji", "Apple Symbols", sans-serif;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: help;
    opacity: 0.85;
  }
  .info-button:hover { opacity: 1; transform: scale(1.08); }
  .info-button:focus-visible {
    opacity: 1;
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .info-tip {
    position: fixed;
    z-index: 100;
    max-width: min(300px, calc(100vw - 24px));
    padding: 9px 11px;
    border-radius: 8px;
    background: var(--text);
    color: var(--panel);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    font-size: 12px;
    line-height: 1.4;
    pointer-events: none;
    white-space: normal;
  }
  .unit { color: var(--muted); font-weight: 400; font-size: 11.5px; }
  .badge {
    margin-left: auto;
    font-size: 9.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 7px;
  }
  .reset {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    padding: 2px 4px;
  }
  .reset:hover { text-decoration: underline; }
  .control { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  input[type="text"], input[type="number"] {
    appearance: none;
    background: var(--field);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 9px;
    font: inherit;
    min-width: 88px;
  }
  input[type="text"] { width: min(420px, 100%); }
  input[type="number"] { width: 92px; }
  select {
    background: var(--field);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 9px;
    font: inherit;
    min-width: 150px;
  }
  input[type="range"] { width: min(300px, 45vw); accent-color: var(--accent); }
  input[type="checkbox"].switch {
    appearance: none;
    width: 38px;
    height: 22px;
    border-radius: 999px;
    background: var(--line);
    position: relative;
    cursor: pointer;
    transition: background 120ms ease;
    flex: 0 0 auto;
  }
  input[type="checkbox"].switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 120ms ease;
  }
  input[type="checkbox"].switch:checked { background: var(--accent); }
  input[type="checkbox"].switch:checked::after { transform: translateX(16px); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    user-select: none;
  }
  .chip input { accent-color: var(--accent); margin: 0; }
  .field.invalid { border-left: 3px solid var(--danger); padding-left: 12px; margin-left: -15px; }
  .error { display: none; color: var(--danger); font-size: 11.5px; margin-top: 6px; }
  .field.invalid .error { display: block; }
  .group-heading {
    margin: 18px 0 0;
    padding: 0 0 7px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
  }
  .group-heading:first-child { margin-top: 0; }
  .section-tabs {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 -26px 2px;
    padding: 11px 26px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .section-tab {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--field);
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 10px;
    font: inherit;
    font-size: 11.5px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .section-tab:hover { border-color: var(--muted); color: var(--text); }
  .section-tab.active {
    background: var(--accent-soft);
    border-color: transparent;
    color: var(--accent);
    font-weight: 600;
  }
  .section-tab-count {
    min-width: 17px;
    padding: 0 5px;
    border-radius: 999px;
    background: rgba(127, 127, 127, 0.14);
    font-size: 9.5px;
    font-weight: 600;
    line-height: 15px;
    text-align: center;
  }
  .section-tab.active .section-tab-count {
    background: rgba(10, 132, 255, 0.16);
    color: var(--accent);
  }
  .excluded-list { padding-top: 2px; }
  .excluded-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .excluded-row:last-child { border-bottom: 0; }
  .excluded-info { flex: 1 1 auto; min-width: 0; }
  .excluded-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .excluded-name { font-weight: 600; }
  .excluded-state {
    flex: 0 0 auto;
    padding: 2px 7px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .excluded-id {
    margin-top: 3px;
    color: var(--muted);
    font: 10.5px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    overflow-wrap: anywhere;
  }
  .include-button {
    appearance: none;
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--field);
    color: var(--accent);
    border-radius: 7px;
    padding: 5px 10px;
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }
  .include-button:hover { border-color: var(--accent); }
  .excluded-empty { color: var(--muted); margin: 18px 0; }
  .shortcut-control { gap: 8px; }
  .shortcut-key {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--field);
    color: var(--text);
    border-radius: 7px;
    padding: 6px 10px;
    min-width: 190px;
    text-align: left;
    font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    cursor: pointer;
  }
  .shortcut-key:hover { border-color: var(--muted); }
  .shortcut-key.recording {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .shortcut-clear {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    padding: 2px 4px;
  }
  .shortcut-clear:hover { color: var(--danger); text-decoration: underline; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">MacOmarchy</div>
    <nav id="nav"></nav>
    <div class="side-foot">Settings file<br><code id="path"></code></div>
  </aside>
  <main>
    <header>
      <div>
        <div class="title-line">
          <h1 id="title">Settings</h1>
          <span id="section-info"></span>
        </div>
      </div>
      <div class="actions">
        <button class="action" id="reload" title="Re-read the settings file">Reload</button>
        <button class="action" id="close" title="Close this window">Close</button>
      </div>
    </header>
    <div id="banner" class="banner hidden"></div>
    <section id="content"></section>
    <div id="info-tip" class="info-tip hidden" role="tooltip"></div>
  </main>
</div>
<script>window.MACOMARCHY_BOOT = __BOOT_JSON__;</script>
<script>
(function () {
  "use strict";

  var boot = window.MACOMARCHY_BOOT || {};
  var schema = boot.schema || { properties: {} };
  var sections = schema.properties || {};
  var preferredOrder = ["ui", "shortcuts", "tiler", "desktops", "focus", "clipboard"];
  var state = {
    values: boot.values || {},
    defaults: boot.defaults || {},
    errors: boot.errors || [],
    excludedApps: boot.excludedApps || []
  };

  function sectionNames() {
    var names = Object.keys(sections);
    names.sort(function (a, b) {
      var left = preferredOrder.indexOf(a);
      var right = preferredOrder.indexOf(b);
      if (left < 0) left = preferredOrder.length;
      if (right < 0) right = preferredOrder.length;
      return left - right || a.localeCompare(b);
    });
    return names;
  }

  var current = sectionNames()[0] || "";
  var shortcutGroup = null;
  var tilingView = "options";
  var timers = {};
  var port = "macomarchySettings";

  function get(path, root) {
    var node = root || state.values;
    var parts = path.split(".");
    for (var i = 0; i < parts.length; i++) {
      if (node === null || typeof node !== "object") return undefined;
      node = node[parts[i]];
    }
    return node;
  }

  function sectionOf(path) {
    return path.split(".")[0];
  }

  function fieldSchema(path) {
    var node = schema;
    var parts = path.split(".");
    for (var i = 0; i < parts.length; i++) {
      if (!node || !node.properties) return null;
      node = node.properties[parts[i]];
    }
    return node || null;
  }

  function sectionSchema(name) {
    return sections[name] || {};
  }

  function orderedKeys(spec) {
    var properties = spec.properties || {};
    var order = Array.isArray(spec["x-order"]) ? spec["x-order"] : [];
    var keys = order.filter(function (key) {
      return Object.prototype.hasOwnProperty.call(properties, key);
    });
    Object.keys(properties).forEach(function (key) {
      if (keys.indexOf(key) < 0) keys.push(key);
    });
    return keys;
  }

  function same(a, b) {
    try { return JSON.stringify(a) === JSON.stringify(b); } catch (error) { return false; }
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  var infoTip = null;

  function hideInfo() {
    if (!infoTip) infoTip = document.getElementById("info-tip");
    if (!infoTip) return;
    infoTip.classList.add("hidden");
  }

  function showInfo(anchor, text) {
    if (!infoTip) infoTip = document.getElementById("info-tip");
    if (!infoTip) return;
    infoTip.textContent = text;
    infoTip.classList.remove("hidden");
    var rect = anchor.getBoundingClientRect();
    var tipRect = infoTip.getBoundingClientRect();
    var margin = 12;
    var gap = 8;
    var left = rect.right + gap;
    var top = rect.top + rect.height / 2 - tipRect.height / 2;
    if (left + tipRect.width > window.innerWidth - margin) {
      left = rect.left - tipRect.width - gap;
    }
    if (left < margin) {
      left = rect.left + rect.width / 2 - tipRect.width / 2;
      top = rect.bottom + gap;
    }
    left = Math.max(margin, Math.min(left, window.innerWidth - tipRect.width - margin));
    top = Math.max(margin, Math.min(top, window.innerHeight - tipRect.height - margin));
    infoTip.style.left = Math.round(left) + "px";
    infoTip.style.top = Math.round(top) + "px";
  }

  function infoButton(text) {
    var button = el("button", "info-button", "ℹ️");
    button.type = "button";
    button.setAttribute("aria-label", "More information: " + text);
    button.addEventListener("mouseenter", function () { showInfo(button, text); });
    button.addEventListener("mouseleave", hideInfo);
    button.addEventListener("focus", function () { showInfo(button, text); });
    button.addEventListener("blur", hideInfo);
    button.addEventListener("click", function (event) {
      event.preventDefault();
      showInfo(button, text);
    });
    button.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        hideInfo();
        button.blur();
      }
    });
    return button;
  }

  function send(message) {
    try {
      window.webkit.messageHandlers[port].postMessage(message);
    } catch (error) {
      state.errors = ["The settings bridge is unavailable. Reopen the window from Hammerspoon."];
      renderBanner();
    }
  }

  function commit(path, value) {
    if (same(get(path), value)) return;
    send({ type: "set", path: path, value: value });
  }

  function schedule(path, value, delay) {
    clearTimeout(timers[path]);
    timers[path] = setTimeout(function () {
      delete timers[path];
      commit(path, value);
    }, delay);
  }

  function showBanner() {
    var banner = document.getElementById("banner");
    if (!state.errors.length) {
      banner.classList.add("hidden");
      banner.textContent = "";
      return;
    }
    banner.classList.remove("hidden");
    banner.textContent = state.errors.slice(0, 4).join(" · ");
  }

  function fieldError(path) {
    for (var i = 0; i < state.errors.length; i++) {
      if (state.errors[i].indexOf(path + ":") === 0) return state.errors[i].slice(path.length + 2);
      if (state.errors[i].indexOf("conflicts with " + path) >= 0) return state.errors[i];
    }
    return "";
  }

  function updateFieldError(node, path) {
    var message = fieldError(path);
    var error = node.querySelector(".error");
    if (!error) return;
    error.textContent = message || "";
    node.classList.toggle("invalid", Boolean(message));
  }

  function updateErrors() {
    var fields = document.querySelectorAll(".field[data-path]");
    for (var i = 0; i < fields.length; i++) {
      updateFieldError(fields[i], fields[i].getAttribute("data-path"));
    }
    showBanner();
  }

  var shortcutLabels = {cmd: "Cmd", ctrl: "Ctrl", alt: "Option", shift: "Shift"};
  var shortcutKeys = {
    space: "Space", return: "Return", escape: "Esc", tab: "Tab",
    backspace: "Backspace", delete: "Delete", home: "Home", end: "End",
    pageup: "Page Up", pagedown: "Page Down",
    left: "Left", right: "Right", up: "Up", down: "Down"
  };
  var shortcutOrder = ["cmd", "ctrl", "alt", "shift"];
  var activeRecord = null;

  function formatCombo(value) {
    if (!value || String(value).toLowerCase() === "none") return "None";
    var modifiers = [];
    var key = "";
    String(value).toLowerCase().split("+").forEach(function (part) {
      if (!part) return;
      if (shortcutLabels[part]) modifiers.push(part);
      else key = part;
    });
    modifiers.sort(function (a, b) { return shortcutOrder.indexOf(a) - shortcutOrder.indexOf(b); });
    var labels = modifiers.map(function (modifier) { return shortcutLabels[modifier]; });
    if (key) labels.push(shortcutKeys[key] || (key.length === 1 ? key.toUpperCase() : key));
    return labels.length ? labels.join(" + ") : "None";
  }

  function comboFromEvent(event) {
    var modifiers = [];
    if (event.metaKey) modifiers.push("cmd");
    if (event.ctrlKey) modifiers.push("ctrl");
    if (event.altKey) modifiers.push("alt");
    if (event.shiftKey) modifiers.push("shift");
    var raw = event.key;
    if (["Shift", "Control", "Alt", "Meta", "CapsLock"].indexOf(raw) >= 0) return "";
    var named = {
      " ": "space", "Enter": "return", "Escape": "escape", "Tab": "tab",
      "Backspace": "backspace", "Delete": "delete", "Home": "home", "End": "end",
      "PageUp": "pageup", "PageDown": "pagedown",
      "ArrowLeft": "left", "ArrowRight": "right", "ArrowUp": "up", "ArrowDown": "down"
    };
    var key = named[raw] || raw.toLowerCase();
    if (key === "+") return "";
    if (key.length > 1 && !/^f\d+$/.test(key)) return "";
    var hasCommand = modifiers.indexOf("cmd") >= 0 || modifiers.indexOf("ctrl") >= 0
      || modifiers.indexOf("alt") >= 0;
    if (!hasCommand && !/^f\d+$/.test(key)) return "";
    modifiers.sort(function (a, b) { return shortcutOrder.indexOf(a) - shortcutOrder.indexOf(b); });
    var parts = modifiers.slice();
    parts.push(key);
    return parts.join("+");
  }

  function stopRecording() {
    if (!activeRecord) return;
    window.removeEventListener("keydown", activeRecord.handler, true);
    activeRecord.button.classList.remove("recording");
    activeRecord.button.textContent = formatCombo(get(activeRecord.path));
    activeRecord = null;
    send({type: "capture", active: false});
  }

  function recordShortcut(path, button) {
    if (activeRecord) stopRecording();
    send({type: "capture", active: true});
    var handler = function (event) {
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      if (event.repeat) return;
      if (event.key === "Escape") { stopRecording(); return; }
      var combo = comboFromEvent(event);
      if (!combo) { button.textContent = "Add Cmd, Ctrl or Option"; return; }
      stopRecording();
      button.textContent = formatCombo(combo);
      commit(path, combo);
    };
    activeRecord = {path: path, button: button, handler: handler};
    button.classList.add("recording");
    button.textContent = "Press shortcut…";
    window.addEventListener("keydown", handler, true);
  }

  function shortcutControl(path) {
    var wrap = el("div", "control shortcut-control");
    var button = el("button", "shortcut-key");
    button.type = "button";
    button.textContent = formatCombo(get(path));
    button.title = "Click, then press the new shortcut";
    button.addEventListener("click", function () { recordShortcut(path, button); });
    var clear = el("button", "shortcut-clear", "Disable");
    clear.type = "button";
    clear.title = "Set this shortcut to None";
    clear.addEventListener("click", function () {
      stopRecording();
      button.textContent = "None";
      commit(path, "none");
    });
    wrap.appendChild(button);
    wrap.appendChild(clear);
    return wrap;
  }

  function controlFor(path, spec) {
    var wrap = el("div", "control");
    var value = get(path);
    var type = spec.type;
    var step = typeof spec["x-step"] === "number" ? spec["x-step"] : (type === "integer" ? 1 : 0.01);

    if (spec["x-format"] === "shortcut") return shortcutControl(path);

    if (type === "boolean") {
      var box = el("input");
      box.type = "checkbox";
      box.className = "switch";
      box.checked = value === true;
      box.addEventListener("change", function () { commit(path, box.checked); });
      wrap.appendChild(box);
      return wrap;
    }

    if (type === "array" && spec.items && spec.items.enum) {
      var chips = el("div", "chips");
      var chosen = Array.isArray(value) ? value.slice() : [];
      spec.items.enum.forEach(function (item) {
        var label = el("label", "chip");
        var check = el("input");
        check.type = "checkbox";
        check.value = item;
        check.checked = chosen.indexOf(item) >= 0;
        check.addEventListener("change", function () {
          var selected = [];
          var inputs = chips.querySelectorAll("input:checked");
          for (var i = 0; i < inputs.length; i++) selected.push(inputs[i].value);
          commit(path, selected);
        });
        label.appendChild(check);
        label.appendChild(document.createTextNode(item));
        chips.appendChild(label);
      });
      wrap.appendChild(chips);
      return wrap;
    }

    if (type === "array") {
      var arrayInput = el("input");
      arrayInput.type = "text";
      arrayInput.value = Array.isArray(value) ? value.join(", ") : "";
      arrayInput.placeholder = "comma-separated values";
      arrayInput.addEventListener("change", function () {
        var items = arrayInput.value.split(",").map(function (item) { return item.trim(); })
          .filter(function (item) { return item.length > 0; });
        commit(path, items);
      });
      wrap.appendChild(arrayInput);
      return wrap;
    }

    if (spec.enum) {
      var select = el("select");
      spec.enum.forEach(function (option) {
        var item = el("option", "", option);
        item.value = option;
        if (option === value) item.selected = true;
        select.appendChild(item);
      });
      select.addEventListener("change", function () { commit(path, select.value); });
      wrap.appendChild(select);
      return wrap;
    }

    if (type === "number" || type === "integer") {
      var number = el("input");
      number.type = "number";
      number.value = value === undefined ? "" : value;
      number.step = String(step);
      if (typeof spec.minimum === "number") number.min = String(spec.minimum);
      if (typeof spec.maximum === "number") number.max = String(spec.maximum);

      var commitNumber = function () {
        if (number.value === "") return;
        var next = Number(number.value);
        if (!isFinite(next)) return;
        if (type === "integer" || step >= 1) next = Math.round(next);
        if (typeof spec.minimum === "number") next = Math.max(spec.minimum, next);
        if (typeof spec.maximum === "number") next = Math.min(spec.maximum, next);
        number.value = String(next);
        if (range) range.value = String(next);
        commit(path, next);
      };

      var range = null;
      if (typeof spec.minimum === "number" && typeof spec.maximum === "number") {
        range = el("input");
        range.type = "range";
        range.min = String(spec.minimum);
        range.max = String(spec.maximum);
        range.step = String(step);
        range.value = value === undefined ? String(spec.minimum) : String(value);
        range.addEventListener("input", function () { number.value = range.value; });
        range.addEventListener("change", commitNumber);
        wrap.appendChild(range);
      }
      number.addEventListener("change", commitNumber);
      wrap.appendChild(number);
      return wrap;
    }

    var text = el("input");
    text.type = "text";
    text.value = value === undefined ? "" : String(value);
    text.addEventListener("input", function () { schedule(path, text.value, 400); });
    text.addEventListener("change", function () {
      clearTimeout(timers[path]);
      commit(path, text.value);
    });
    wrap.appendChild(text);
    return wrap;
  }

  function field(path, spec, parentSection) {
    var node = el("div", "field");
    node.setAttribute("data-path", path);

    var head = el("div", "field-head");
    var title = el("span", "field-title");
    title.appendChild(el("span", "field-name", spec.title || path.split(".").pop()));
    if (spec.description) title.appendChild(infoButton(spec.description));
    head.appendChild(title);
    if (spec["x-unit"]) head.appendChild(el("span", "unit", "(" + spec["x-unit"] + ")"));
    var klass = spec["x-class"] || parentSection["x-class"];
    if (klass) head.appendChild(el("span", "badge", klass));
    var reset = el("button", "reset", "Reset");
    reset.type = "button";
    reset.title = "Return to the default value";
    reset.addEventListener("click", function () { stopRecording(); send({ type: "unset", path: path }); });
    head.appendChild(reset);
    node.appendChild(head);

    node.appendChild(controlFor(path, spec));
    node.appendChild(el("div", "error"));
    updateFieldError(node, path);
    return node;
  }

  function renderNav() {
    var nav = document.getElementById("nav");
    nav.textContent = "";
    sectionNames().forEach(function (name) {
      var button = el("button", "nav-item" + (name === current ? " active" : ""),
        sectionSchema(name).title || name);
      button.type = "button";
      button.addEventListener("click", function () {
        current = name;
        render();
      });
      nav.appendChild(button);
    });
  }

  function shortcutGroups(spec) {
    var properties = spec.properties || {};
    var groups = [], byName = {};
    orderedKeys(spec).forEach(function (key) {
      var name = properties[key]["x-group"] || "Other";
      if (!byName[name]) {
        byName[name] = {name: name, keys: []};
        groups.push(byName[name]);
      }
      byName[name].keys.push(key);
    });
    return groups;
  }

  function sectionTabs(items, active, onSelect) {
    var bar = el("div", "section-tabs");
    bar.setAttribute("role", "tablist");
    bar.setAttribute("aria-label", "Views");
    items.forEach(function (item) {
      var button = el("button", "section-tab");
      button.type = "button";
      button.setAttribute("role", "tab");
      button.setAttribute("aria-selected", item.id === active ? "true" : "false");
      if (item.id === active) button.classList.add("active");
      button.appendChild(el("span", "section-tab-label", item.label));
      if (item.count !== undefined) {
        button.appendChild(el("span", "section-tab-count", String(item.count)));
      }
      button.addEventListener("click", function () {
        if (item.id === active) return;
        onSelect(item.id);
      });
      bar.appendChild(button);
    });
    return bar;
  }

  function selectSectionView(apply) {
    stopRecording();
    apply();
    hideInfo();
    renderSection();
    var content = document.getElementById("content");
    if (content) content.scrollTop = 0;
    var selected = document.querySelector(".section-tab.active");
    if (selected) selected.focus();
  }

  function excludedAppsPanel(apps) {
    var list = el("div", "excluded-list");
    if (!apps.length) {
      list.appendChild(el("p", "excluded-empty", "No apps are excluded from tiling."));
      return list;
    }
    apps.forEach(function (app) {
      var row = el("div", "excluded-row");
      var info = el("div", "excluded-info");
      var title = el("div", "excluded-title");
      title.appendChild(el("span", "excluded-name", app.name || app.bundleID || "Unknown app"));
      title.appendChild(el("span", "excluded-state",
        app.builtin ? "Always excluded" : "Excluded"));
      info.appendChild(title);
      if (app.bundleID) info.appendChild(el("div", "excluded-id", app.bundleID));
      row.appendChild(info);
      if (!app.builtin && app.bundleID) {
        var button = el("button", "include-button", "Include");
        button.type = "button";
        button.title = "Tile this app again";
        button.addEventListener("click", function () {
          send({type: "includeApp", bundleID: app.bundleID, name: app.name || ""});
        });
        row.appendChild(button);
      }
      list.appendChild(row);
    });
    return list;
  }

  function renderSection() {
    var spec = sectionSchema(current);
    document.getElementById("title").textContent = spec.title || "Settings";
    var sectionInfo = document.getElementById("section-info");
    sectionInfo.textContent = "";
    if (spec.description) sectionInfo.appendChild(infoButton(spec.description));
    var content = document.getElementById("content");
    content.textContent = "";
    var properties = spec.properties || {};
    if (current === "shortcuts") {
      var groups = shortcutGroups(spec);
      var names = groups.map(function (group) { return group.name; });
      if (!shortcutGroup || names.indexOf(shortcutGroup) < 0) shortcutGroup = names[0];
      content.appendChild(sectionTabs(groups.map(function (group) {
        return {id: group.name, label: group.name, count: group.keys.length};
      }), shortcutGroup, function (id) {
        selectSectionView(function () { shortcutGroup = id; });
      }));
      var active = groups.filter(function (group) { return group.name === shortcutGroup; })[0];
      if (active) {
        active.keys.forEach(function (key) {
          content.appendChild(field(current + "." + key, properties[key], spec));
        });
      }
    } else if (current === "tiler") {
      var apps = state.excludedApps || [];
      content.appendChild(sectionTabs([
        {id: "options", label: "Options"},
        {id: "excluded", label: "Excluded apps", count: apps.length}
      ], tilingView, function (id) {
        selectSectionView(function () {
          tilingView = id;
          if (id === "excluded") send({type: "refreshExclusions"});
        });
      }));
      if (tilingView === "excluded") {
        content.appendChild(excludedAppsPanel(apps));
      } else {
        orderedKeys(spec).forEach(function (key) {
          content.appendChild(field(current + "." + key, properties[key], spec));
        });
      }
    } else {
      var lastGroup = null;
      orderedKeys(spec).forEach(function (key) {
        var child = properties[key];
        var group = child["x-group"];
        if (group && group !== lastGroup) {
          content.appendChild(el("div", "group-heading", group));
          lastGroup = group;
        }
        content.appendChild(field(current + "." + key, child, spec));
      });
    }
    updateErrors();
  }

  function render() {
    stopRecording();
    hideInfo();
    var path = boot.userPath || "";
    var home = path.match(/^\/Users\/[^/]+/);
    if (home) path = "~" + path.slice(home[0].length);
    var pathNode = document.getElementById("path");
    pathNode.textContent = path || "defaults only";
    pathNode.title = boot.userPath || "";
    renderNav();
    renderSection();
  }

  window.macomarchy = {
    onResult: function (payload) {
      if (!payload) return;
      if (payload.values) state.values = payload.values;
      if (payload.defaults) state.defaults = payload.defaults;
      if (payload.excludedApps) state.excludedApps = payload.excludedApps;
      state.errors = payload.errors || [];
      if (payload.action === "includeApp" || payload.action === "toggleExclude"
          || payload.action === "exclusions") {
        if (current === "tiler") renderSection();
        else updateErrors();
      } else if (payload.action === "unset" || payload.action === "reset"
          || payload.action === "reload") {
        render();
      } else {
        if (payload.action === "set" && typeof payload.path === "string"
            && payload.path.indexOf("shortcuts.") === 0) {
          var button = document.querySelector('[data-path="' + payload.path + '"] .shortcut-key');
          if (button) button.textContent = formatCombo(get(payload.path));
        }
        updateErrors();
      }
      if (payload.ok === false) showBanner();
    }
  };

  window.addEventListener("scroll", hideInfo, true);
  window.addEventListener("resize", hideInfo);
  window.addEventListener("blur", hideInfo);

  document.getElementById("reload").addEventListener("click", function () {
    send({ type: "reload" });
  });
  document.getElementById("close").addEventListener("click", function () {
    stopRecording();
    send({ type: "close" });
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") send({ type: "close" });
  });

  render();
})();
</script>
</body>
</html>
